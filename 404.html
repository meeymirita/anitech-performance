<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — ANITECH</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#050407;--fg:#f7f2f5;--mut:#a89fa6;--acc:#ff3d8b}
@media (prefers-color-scheme:light){:root{--bg:#f7f2f5;--fg:#18141a;--mut:#6b6168}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
b{display:block;font-size:clamp(72px,18vw,160px);line-height:1;font-weight:900;letter-spacing:-.04em;color:var(--acc)}
p{color:var(--mut);margin:12px 0 28px}
a{display:inline-block;padding:12px 22px;border:2px solid var(--fg);color:var(--fg);text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
a:hover{background:var(--fg);color:var(--bg)}
</style>
</head>
<body>
<main><b>404</b><p>Такой страницы нет. Возможно, лаба переехала или ссылка устарела.</p><a href="/">На главную</a></main>
</body>
</html>
