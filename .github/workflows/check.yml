name: Check site
# Автопроверка целостности (tools/check-site.py) на каждый пуш и PR.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 tools/check-site.py
