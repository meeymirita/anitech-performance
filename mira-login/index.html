<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход — ANITECH</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f4f2ed; --panel:#fff; --ink:#1a1a1d; --muted:#61626b; --line:#dedbd3; --accent:#0b7f5f; --accent-ink:#fff; --accent-soft:#dff1ea; --bad:#b3261e; --bad-soft:#fbe4e2; --shadow:0 18px 50px rgba(20,20,30,.12); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1012; --panel:#17181b; --ink:#ecebe6; --muted:#9b9ca5; --line:#2a2b30; --accent:#3ccf9f; --accent-ink:#06201a; --accent-soft:#11302a; --bad:#ff8f86; --bad-soft:#3a1714; --shadow:0 18px 50px rgba(0,0,0,.5); } }
  :root[data-theme="dark"] { --bg:#0f1012; --panel:#17181b; --ink:#ecebe6; --muted:#9b9ca5; --line:#2a2b30; --accent:#3ccf9f; --accent-ink:#06201a; --accent-soft:#11302a; --bad:#ff8f86; --bad-soft:#3a1714; --shadow:0 18px 50px rgba(0,0,0,.5); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 20px;
    background-image: radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), radial-gradient(700px 420px at 100% 110%, color-mix(in srgb, #2358b8 12%, transparent), transparent 60%); }
  .card { width: min(100%, 420px); background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 34px 30px 28px; box-shadow: var(--shadow); }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 18px; }
  .logo svg { width: 26px; height: 26px; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 6px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 15.5px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--muted); }
  .field { position: relative; }
  input[type="password"], input[type="text"].pw { width: 100%; font: inherit; font-size: 17px; padding: 13px 88px 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .field.err input { border-color: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 18%, transparent); }
  .toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .toggle:hover { color: var(--ink); background: var(--line); }
  button.go { width: 100%; margin-top: 16px; font: inherit; font-size: 17px; font-weight: 700; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: flex; gap: 10px; align-items: center; justify-content: center; transition: filter .15s, transform .05s; }
  button.go:hover { filter: brightness(1.06); } button.go:active { transform: translateY(1px); } button.go:disabled { opacity: .7; cursor: default; }
  .spin { width: 16px; height: 16px; border: 2.5px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); border-top-color: var(--accent-ink); border-radius: 50%; animation: sp .7s linear infinite; display: none; }
  .busy .spin { display: inline-block; } @keyframes sp { to { transform: rotate(360deg); } }
  .msg { min-height: 24px; margin-top: 12px; font-size: 14.5px; color: var(--bad); }
  .msg:not(:empty) { background: var(--bad-soft); border-radius: 10px; padding: 8px 12px; }
  .hint { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .hint button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<script>try { var t = localStorage.getItem('mira-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg></div>
  <div class="brand">ANITECH</div>
  <h1>Закрытая страница</h1>
  <p class="sub">Шпаргалка владельца. Введите пароль, чтобы продолжить.</p>

  <form id="f" autocomplete="on" novalidate>
    <input type="text" name="username" value="mira" autocomplete="username" hidden>
    <label for="pw">Пароль</label>
    <div class="field" id="field">
      <input id="pw" class="pw" type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required>
      <button type="button" class="toggle" id="eye" aria-label="Показать пароль" aria-pressed="false">Показать</button>
    </div>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    <button class="go" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="goText">Войти</span></button>
  </form>

  <div class="hint"><span>Нет доступа? Это личная страница владельца.</span><button type="button" id="theme" aria-label="Переключить тему">◐</button></div>
</main>
<script>
(function () {
  var f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), field = document.getElementById('field'),
      go = document.getElementById('go'), goText = document.getElementById('goText'), eye = document.getElementById('eye');

  eye.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.textContent = show ? 'Скрыть' : 'Показать';
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    eye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
    pw.focus();
  });

  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark'; root.dataset.theme = next;
    try { localStorage.setItem('mira-theme', next); } catch (e) {}
  });

  function fail(text) { msg.textContent = text; field.classList.add('err'); go.disabled = false; go.classList.remove('busy'); goText.textContent = 'Войти'; pw.focus(); pw.select(); }
  pw.addEventListener('input', function () { msg.textContent = ''; field.classList.remove('err'); });

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) { fail('Введите пароль.'); return; }
    go.disabled = true; go.classList.add('busy'); goText.textContent = 'Проверяю…'; msg.textContent = ''; field.classList.remove('err');
    var token; try { token = btoa(unescape(encodeURIComponent('mira:' + pw.value))); } catch (err) { fail('Не удалось обработать пароль.'); return; }
    fetch('/mira-api/login', { method: 'POST', headers: { 'Authorization': 'Basic ' + token }, cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 204 || r.ok) { goText.textContent = 'Готово'; location.replace('/mira/'); }
        else if (r.status === 401) fail('Неверный пароль. Проверьте раскладку клавиатуры — можно нажать «Показать».');
        else fail('Сервер ответил ошибкой (' + r.status + '). Попробуйте ещё раз.');
      })
      .catch(function () { fail('Нет связи с сервером. Проверьте интернет и попробуйте снова.'); });
  });
})();
</script>
</body>
</html>
